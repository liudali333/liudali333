name: Contribution City
on:
  push:
    paths:
      - '.github/workflows/profile-3d.yml'
  schedule:
    - cron: '20 19 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: contribution-city
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Create looping city animation
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          source = Path("profile-3d-contrib/profile-night-green.svg")
          def loop(match):
              tag = match.group(0).replace('repeatCount="1"', 'repeatCount="indefinite"').replace('dur="3s"', 'dur="8s"')
              return re.sub(r'values="([^"]+)"', lambda m: 'values="' + m[1] + ';' + m[1].split(';')[0] + '"', tag)
          result = re.sub(r'<animate(?:Transform)?\b[^>]*>', loop, source.read_text())
          import xml.etree.ElementTree as ET
          ET.fromstring(result)
          source.with_name("profile-night-green-loop.svg").write_text(result)
          PY
      - name: Publish city
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: refresh contribution city"
          git pull --rebase origin main
          git push origin HEAD:main
