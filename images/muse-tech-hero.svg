<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460">
<style>
.orbit{transform-origin:980px 220px;animation:spin 18s linear infinite}
.reverse{animation-direction:reverse;animation-duration:12s}
.pulse{animation:pulse 3s ease-in-out infinite}
.scan{animation:scan 7s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes scan{0%,100%{transform:translateY(0);opacity:0}15%,85%{opacity:.45}50%{transform:translateY(290px);opacity:.45}}
@media(prefers-reduced-motion:reduce){.orbit,.pulse,.scan{animation:none}}
</style><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101311"/><stop offset="1" stop-color="#1c211d"/></linearGradient><linearGradient id="accent"><stop stop-color="#c2d4b6"/><stop offset="1" stop-color="#e4e5d9"/></linearGradient><radialGradient id="glow"><stop stop-color="#74806b" stop-opacity=".38"/><stop offset="1" stop-color="#74806b" stop-opacity="0"/></radialGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#a9b5a0" stroke-opacity=".055"/></pattern></defs>
<rect width="1200" height="460" rx="16" fill="url(#bg)"/><rect width="1200" height="460" rx="24" fill="url(#grid)"/><ellipse cx="970" cy="180" rx="330" ry="290" fill="url(#glow)"/>
<g fill="none" stroke-width="1"><circle cx="980" cy="220" r="140" stroke="#b0bea5" stroke-opacity=".35"/><circle cx="980" cy="220" r="110" stroke="#c2d4b6" stroke-opacity=".45"/><ellipse cx="980" cy="220" rx="175" ry="55" transform="rotate(-35 980 220)" stroke="#b0bea5" stroke-opacity=".65"/><path d="M980 80V360M840 220H1120" stroke="#919d87" stroke-opacity=".25"/></g>
<circle cx="980" cy="220" r="37" fill="#20261f" stroke="#c2d4b6"/><path d="m966 220 10 10 19-22" fill="none" stroke="#c2d4b6" stroke-width="3"/><g class="orbit"><circle cx="1070" cy="113" r="6" fill="#c2d4b6"/><path d="M980 80 A140 140 0 0 1 1120 220" fill="none" stroke="#c2d4b6" stroke-width="3" stroke-linecap="round"/></g><g class="orbit reverse"><circle cx="980" cy="110" r="4" fill="#e4e5d9"/><path d="M870 220 A110 110 0 0 1 980 110" fill="none" stroke="#e4e5d9" stroke-width="2"/></g><circle class="pulse" cx="980" cy="220" r="47" fill="none" stroke="#c2d4b6" stroke-opacity=".5"/><path class="scan" d="M64 76H750" stroke="#c2d4b6" stroke-opacity=".25"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="64" y="69" font-size="13" letter-spacing="4" fill="#a1aa9b">LIU DALI / PERSONAL LAB</text><circle class="pulse" cx="67" cy="118" r="4" fill="#c2d4b6"/><text x="82" y="123" font-size="12" letter-spacing="2" fill="#c2d4b6">AI · E-COMMERCE · AUTOMATION</text><text x="60" y="207" font-size="64" font-weight="700" letter-spacing="-2" fill="#f1f0ea">Less repetition.</text><text x="60" y="280" font-size="64" font-weight="700" letter-spacing="-2" fill="url(#accent)">More creation.</text><text x="64" y="330" font-size="21" fill="#bdc4b6">把 AI 接入业务，把重复工作交给自动化。</text><path d="M64 373H1136" stroke="#b0bea5" stroke-opacity=".2"/><text x="64" y="412" font-size="12" letter-spacing="2" fill="#8a9484">AGENTS / WORKFLOWS / SELF-HOSTED</text><text x="918" y="412" font-size="12" letter-spacing="2" fill="#a8b49e">IDEA → SYSTEM → IMPACT</text></g></svg>