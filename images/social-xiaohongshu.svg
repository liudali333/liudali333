<svg xmlns="http://www.w3.org/2000/svg" width="300" height="100" viewBox="0 0 300 100"><defs><clipPath id="card"><rect x="1" y="1" width="298" height="98" rx="12"/></clipPath><linearGradient id="shine"><stop stop-color="white" stop-opacity="0"/><stop offset=".5" stop-color="white" stop-opacity=".22"/><stop offset="1" stop-color="white" stop-opacity="0"/></linearGradient></defs><style>.shine{animation:sweep 4.8s ease-in-out infinite;animation-delay:0s}.arrow{animation:float 2.6s ease-in-out infinite;animation-delay:0s}@keyframes sweep{0%,15%{transform:translateX(-130px)}65%,100%{transform:translateX(440px)}}@keyframes float{0%,100%{transform:translate(0,0);opacity:.65}50%{transform:translate(3px,-3px);opacity:1}}@media(prefers-reduced-motion:reduce){.shine,.arrow{animation:none}.shine{display:none}}</style><rect x="1" y="1" width="298" height="98" rx="12" fill="#e91e42" stroke="#e91e42"/><path d="M24 28v44" stroke="white" stroke-opacity=".65" stroke-width="3"/><text x="48" y="47" fill="#ffffff" font-size="22" font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif">小红书</text><text x="49" y="73" fill="#ffffff" fill-opacity=".8" font-size="12" font-family="Segoe UI,Arial,sans-serif">DALY / SOCIAL</text><path class="arrow" d="M259 36h13v13m0-13-18 18" fill="none" stroke="#ffffff" stroke-width="2"/><g clip-path="url(#card)"><path class="shine" d="M-45 0H25L70 100H0Z" fill="url(#shine)" pointer-events="none"/></g></svg>